# XcodeGen spec. Generate the project with:  xcodegen   (or ./build.sh, which also builds)
# The .xcodeproj is generated, so it is gitignored. Edit this file, not the project.
name: OORehearsal
options:
  bundleIdPrefix: online.owneroperators
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "15.0"
    macOS: "12.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: EKNXJ2NR3G
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  OORehearsal-iOS:
    type: application
    platform: iOS
    sources:
      - Shared
      - iOS
      - path: ../app/songs.js         # the charts (generated by build.py; gitignored)
        buildPhase: resources
        optional: true                # a fresh clone has none: the demo song shows
      - path: ../app/songs.example.js
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: OO Rehearsal
        PRODUCT_BUNDLE_IDENTIFIER: online.owneroperators.rehearsal
        TARGETED_DEVICE_FAMILY: "1,2"   # iPad first; iPhone works too
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: OO Rehearsal
        UILaunchStoryboardName: LaunchScreen
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UIFileSharingEnabled: true              # songs.js drop-in via the Files app
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UIApplicationSceneManifest:            # scene lifecycle; required on iOS 27
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes: []
        NSBluetoothAlwaysUsageDescription: Connects to Bluetooth MIDI foot pedals.
        NSLocalNetworkUsageDescription: Links with OO Rehearsal on the band's other Macs, iPads and phones so every screen stays on the same song and beat.
        NSBonjourServices: [_oo-rehearsal._tcp, _oo-rehearsal._udp]   # PeerLink.serviceType

  OORehearsal-macOS:
    type: application
    platform: macOS
    sources:
      - Shared
      - macOS
      - path: ../app/songs.js         # the charts (generated by build.py; gitignored)
        buildPhase: resources
        optional: true                # a fresh clone has none: the demo song shows
      - path: ../app/songs.example.js
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: OO Rehearsal
        PRODUCT_BUNDLE_IDENTIFIER: online.owneroperators.rehearsal.mac
        ARCHS: "arm64 x86_64"           # universal: the band computer is Intel
        ONLY_ACTIVE_ARCH: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_IDENTITY: "-"         # ad-hoc: copy the .app to any Mac, right-click > Open once
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        COMBINE_HIDPI_IMAGES: YES
    info:
      path: macOS/Info.plist
      properties:
        CFBundleDisplayName: OO Rehearsal
        LSApplicationCategoryType: public.app-category.music
        NSHumanReadableCopyright: OWNER / OPERATORS
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSLocalNetworkUsageDescription: Links with OO Rehearsal on the band's other Macs, iPads and phones so every screen stays on the same song and beat.
        NSBonjourServices: [_oo-rehearsal._tcp, _oo-rehearsal._udp]
